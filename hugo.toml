baseURL = "https://pipery.dev/"
languageCode = "en-us"
title = "Pipery - Vendor-neutral CI/CD pipelines"
theme = ["hugo-brewm", "hugo-book"]
enableRobotsTXT = true
disablePathToLower = true

[params]
  description = "Pipery provides verified, reusable, and observable CI/CD pipelines across platforms like GitHub Actions, GitLab CI, and Bitbucket Pipelines, with structured psh logs, replayable pipery.jsonl output, and a dashboard for debugging workflow runs."
  keywords = ["Pipery", "CI/CD pipelines", "vendor-neutral CI/CD", "CI/CD abstraction", "GitHub Actions CI", "GitLab CI", "Bitbucket Pipelines", "Bitbucket Cloud", "DevOps automation", "pipeline observability", "structured CI logs", "pipery.jsonl", "psh", "Pipery Dashboard", "continuous integration", "continuous delivery"]
  images = "/images/pipery-color.png"
  extMeta = false
  DisableFootBar = false

  primaryColor = "#6366F1"
  secondaryColor = "#7C3AED"
  accentColor = "#06B6D4"
  backgroundColor = "#0F172A"
  textColor = "#E5E7EB"

  twitter = "https://x.com/piperydev"
  youtube = "https://www.youtube.com/@pipery_dev"
  github = "https://github.com/pipery-dev"
  gitlab = "https://gitlab.com/pipery-dev"
  bitbucket = "https://bitbucket.org/pipery-dev"
  discord = "https://discord.gg/bXwQT9npdN"

  googleAnalytics = ""
  customCSS = ["css/custom.css"]
  BookTheme = "dark"
  BookToC = true
  BookLogo = "images/pipery-mark-dark.png"
  BookFavicon = "favicon.png"
  BookSection = "docs"
  BookSearch = true
  BookComments = false
  BookRepo = "https://github.com/pipery-dev/pipery-dev.github.io"
  BookEditLink = "https://github.com/pipery-dev/pipery-dev.github.io/edit/main/{{ .Path }}"
  BookDateFormat = "January 2, 2006"
  unifiedFooter = true
  copyright = "Pipery"

[params.author]
  name = "Pipery"
  email = "admin@pipery.dev"

[params.favicon]
  ico = "/favicon.ico"
  png = "/favicon.png"
  apple = "/apple-touch-icon.png"

[params.logo]
  logoMark = "/images/pipery-mark-light.png"
  logoMarkDark = "/images/pipery-mark-dark.png"
  logoType = false

[params.socialCard]
  enable = true
  opengraph = false
  twitter = false
  twitterSite = "piperydev"
  twitterCreator = "piperydev"
  images = "/images/pipery-color.png"

[params.seo]
  siteName = "Pipery"
  title = "Pipery - Vendor-neutral CI/CD pipelines"
  description = "Define CI/CD once and run reusable, observable delivery workflows across platforms like GitHub Actions, GitLab CI, and Bitbucket Pipelines."
  image = "/images/pipery-color.png"

[params.home]
  disableSlide = true
  disableListing = true

[params.posts]
  share = false
  related = false
  noIndent = false
  justifying = false

[params.search]
  enable = false

[params.typeface]
  webSafe = false
  localHost = false
  serif = "Cormorant"
  sans = "Montserrat"

